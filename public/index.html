<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quick check</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"></script>
    <style>
      :root {
        --bg-color: #f5f6f7;
        --card-bg: #ffffff;
        --text-main: #202124;
        --text-muted: #5f6368;
        --border-color: #dadce0;
        --primary: #315c4c;
        --primary-hover: #264a3d;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      .card {
        width: min(100%, 390px);
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 2rem;
        text-align: center;
        box-sizing: border-box;
      }

      h1 {
        font-size: 1.35rem;
        font-weight: 600;
        margin: 0 0 0.65rem;
      }

      p {
        color: var(--text-muted);
        margin: 0 0 1.5rem;
        line-height: 1.5;
      }

      .turnstile-container {
        display: flex;
        justify-content: center;
        margin-bottom: 1.25rem;
        min-height: 65px;
      }

      button {
        width: 100%;
        padding: 0.85rem 1rem;
        border: none;
        border-radius: 5px;
        background: var(--primary);
        color: white;
        font-size: 0.95rem;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }

      button:hover {
        background: var(--primary-hover);
      }

      button:disabled {
        background: var(--border-color);
        cursor: not-allowed;
      }

      #status-message {
        min-height: 22px;
        margin-top: 1.25rem;
        font-size: 0.85rem;
        font-weight: 600;
      }

      #protected-content {
        display: none;
        margin-top: 1.5rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--border-color);
        color: var(--text-main);
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Just a quick check</h1>
      <p>Please confirm you are a person before continuing.</p>

      <form id="verificationForm">
        <div class="turnstile-container">
          <div id="my-turnstile-widget"></div>
        </div>

        <button type="submit" id="submitBtn" disabled>Continue</button>
      </form>

      <div id="status-message" role="alert"></div>
    </div>

    <script>
      let userToken = '';
      const submitBtn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('status-message');

      function displayMessage(message, color) {
        statusMsg.innerText = message;
        statusMsg.style.color = color;
      }

      async function initTurnstile() {
        try {
          const response = await fetch('/api/config');
          const config = await response.json();

          if (!config.siteKey) {
            throw new Error('Missing site key.');
          }

          if (!window.turnstile) {
            throw new Error('Turnstile script failed to load.');
          }

          window.turnstile.render('#my-turnstile-widget', {
            sitekey: config.siteKey,
            callback: function (token) {
              userToken = token;
              submitBtn.disabled = false;
              displayMessage('Thanks. Click continue when ready.', '#315c4c');
            },
            'expired-callback': function () {
              userToken = '';
              submitBtn.disabled = true;
              displayMessage('The check expired. Please try again.', '#a15c00');
            },
            'error-callback': function () {
              userToken = '';
              submitBtn.disabled = true;
              displayMessage('The check could not be completed. Please try again.', '#a33a3a');
            }
          });
        } catch (error) {
          displayMessage('The check is temporarily unavailable.', '#a33a3a');
        }
      }

      window.addEventListener('load', function () {
        if (window.turnstile) {
          window.turnstile.ready(function () {
            initTurnstile();
          });
        } else {
          displayMessage('The check did not load. Please refresh the page.', '#a33a3a');
        }
      });

      document.getElementById('verificationForm').addEventListener('submit', async function (event) {
        event.preventDefault();

        if (!userToken) {
          return;
        }

        submitBtn.disabled = true;
        displayMessage('Checking...', '#315c4c');

        try {
          const response = await fetch('/api/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: userToken })
          });

          const data = await response.json();

          if (data.success) {
            window.location.replace('/verified.html');
            return;
          }

          displayMessage(data.error || 'The check could not be completed.', '#a33a3a');
          if (window.turnstile) {
            window.turnstile.reset();
          }
          submitBtn.disabled = true;
        } catch (error) {
          displayMessage('Something went wrong. Please try again.', '#a33a3a');
        }
      });
    </script>
  </body>
</html>
