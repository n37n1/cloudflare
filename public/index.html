<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloudflare Turnstile Demo</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"></script>
    <style>
      :root {
        --bg-color: #f8f9fa;
        --card-bg: #ffffff;
        --text-main: #212529;
        --text-muted: #6c757d;
        --border-color: #dee2e6;
        --primary: #0d6efd;
        --primary-hover: #0b5ed7;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      .card {
        width: min(100%, 420px);
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        padding: 2.5rem;
        text-align: center;
        box-sizing: border-box;
      }

      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }

      p {
        color: var(--text-muted);
        margin: 0 0 2rem;
        line-height: 1.5;
      }

      .turnstile-container {
        display: flex;
        justify-content: center;
        margin-bottom: 1.5rem;
        min-height: 65px;
      }

      button {
        width: 100%;
        padding: 0.85rem 1rem;
        border: none;
        border-radius: 6px;
        background: var(--primary);
        color: white;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }

      button:hover {
        background: var(--primary-hover);
      }

      button:disabled {
        background: var(--border-color);
        cursor: not-allowed;
      }

      #status-message {
        min-height: 22px;
        margin-top: 1.25rem;
        font-size: 0.85rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Security Check</h1>
      <p>Please complete the verification below to continue.</p>

      <form id="verificationForm">
        <div class="turnstile-container">
          <div id="my-turnstile-widget"></div>
        </div>

        <button type="submit" id="submitBtn" disabled>Verify & Continue</button>
      </form>

      <div id="status-message" role="alert"></div>
    </div>

    <script>
      let userToken = '';
      const submitBtn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('status-message');

      function displayMessage(message, color) {
        statusMsg.innerText = message;
        statusMsg.style.color = color;
      }

      async function initTurnstile() {
        try {
          const response = await fetch('/api/config');
          const config = await response.json();

          if (!config.siteKey) {
            throw new Error('Missing site key.');
          }

          if (!window.turnstile) {
            throw new Error('Turnstile script failed to load.');
          }

          window.turnstile.render('#my-turnstile-widget', {
            sitekey: config.siteKey,
            callback: function (token) {
              userToken = token;
              submitBtn.disabled = false;
              displayMessage('✓ Challenge passed. Ready to proceed.', '#198754');
            },
            'expired-callback': function () {
              userToken = '';
              submitBtn.disabled = true;
              displayMessage('❌ Verification expired. Please click again.', '#f57c00');
            },
            'error-callback': function () {
              userToken = '';
              submitBtn.disabled = true;
              displayMessage('❌ Challenge failed. Refresh and try again.', '#dc3545');
            }
          });
        } catch (error) {
          displayMessage('Configuration failure. Security system offline.', '#dc3545');
        }
      }

      window.addEventListener('load', function () {
        if (window.turnstile) {
          window.turnstile.ready(function () {
            initTurnstile();
          });
        } else {
          displayMessage('Turnstile script did not load. Please refresh the page.', '#dc3545');
        }
      });

      document.getElementById('verificationForm').addEventListener('submit', async function (event) {
        event.preventDefault();

        if (!userToken) {
          return;
        }

        submitBtn.disabled = true;
        displayMessage('Authenticating token with server...', '#0d6efd');

        try {
          const response = await fetch('/api/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: userToken })
          });

          const data = await response.json();

          if (data.success) {
            displayMessage('🎉 Gateway cleared! Access granted.', '#198754');
            return;
          }

          displayMessage('❌ Access denied: ' + (data.error || 'Verification failed'), '#dc3545');
          if (window.turnstile) {
            window.turnstile.reset();
          }
          submitBtn.disabled = true;
        } catch (error) {
          displayMessage('❌ Communication failure or rate-limit tripped.', '#dc3545');
        }
      });
    </script>
  </body>
</html>
